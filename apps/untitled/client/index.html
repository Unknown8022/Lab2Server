<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Admin Dashboard</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
      body {
        background: #121212;
        color: #e0e0e0;
        font-family: 'Segoe UI', sans-serif;
        padding: 30px;
      }
      .card {
        background: #1e1e1e;
        border-radius: 8px;
        padding: 20px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      }
      h1 {
        color: #00e676;
        border-bottom: 1px solid #333;
        padding-bottom: 10px;
      }
      #status {
        font-weight: bold;
        margin-bottom: 20px;
      }
      .event-item {
        background: #2c2c2c;
        margin: 10px 0;
        padding: 15px;
        border-left: 4px solid #00e676;
        animation: fadeIn 0.5s;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Live Admin Dashboard</h1>
      <div id="status">
        Статус: <span style="color: #ff5252">Connecting...</span>
      </div>
      <div id="events"></div>
    </div>

    <script>
      // Подключаемся к тому же порту, на котором висит сервер
      const socket = io();

      socket.on('connect', () => {
        document.getElementById('status').innerHTML =
          'Статус: <span style="color: #00e676;">Connected</span>';
      });

      socket.on('admin_dashboard_update', (payload) => {
        const container = document.getElementById('events');
        const div = document.createElement('div');
        div.className = 'event-item';
        div.innerHTML = `
                <strong>[${new Date().toLocaleTimeString()}]</strong><br>
                Данные объекта: ${JSON.stringify(payload.data)}
            `;
        container.prepend(div);
      });
    </script>
  </body>
</html>
